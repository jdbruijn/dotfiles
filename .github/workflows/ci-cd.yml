name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - renovate/**
  pull_request: null
jobs:
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@2640cb66d6859e32d04abc8da5c31325e7c0ede4 # v9.0.0
  release:
    uses: vidavidorra/.github/.github/workflows/release.yml@2640cb66d6859e32d04abc8da5c31325e7c0ede4 # v9.0.0
    needs:
      - lint
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
