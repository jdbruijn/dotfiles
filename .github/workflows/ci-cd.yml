name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - renovate/**
  pull_request: null
jobs:
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@5bcb0b10b5a4fb39a0fbe48fcadad13798a7e1dd # v8.1.31
  release:
    uses: vidavidorra/.github/.github/workflows/release.yml@5bcb0b10b5a4fb39a0fbe48fcadad13798a7e1dd # v8.1.31
    needs:
      - lint
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
