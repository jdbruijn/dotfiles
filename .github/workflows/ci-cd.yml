name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - renovate/**
  pull_request: null
jobs:
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@358c6c4c424275625c160e0b8b596297548228ac # v8.1.27
  release:
    uses: vidavidorra/.github/.github/workflows/release.yml@358c6c4c424275625c160e0b8b596297548228ac # v8.1.27
    needs:
      - lint
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
